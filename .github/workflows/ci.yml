# P-001: CI runs the acceptance gate of docs/development.md §2 through scripts/verify.py - the
# script is §2's gate in executable form, so the workflow runs the script rather than transcribing
# the commands (no third copy to drift against; §2 documents the same commands it runs).
#
# Matrix decisions, recorded with reasons (card P-001):
# - All three OSes run the SAME gate, no suite excluded anywhere. Q-007 proved the product end to
#   end on three real machines, and I-004 requires each OS to publish its own RID's NativeAOT
#   artifact (.NET does not cross-compile AOT), so the PublishAot suite runs on every runner.
# - NativeAOT toolchains: GitHub-hosted runners carry each OS's toolchain (VS C++ workload on
#   Windows, Xcode CLT on macOS, clang on Linux). The Linux step below installs clang + zlib dev
#   headers explicitly - development.md §1's documented prerequisite for that suite; the runner
#   images usually ship them, and a guarded apt-get is cheaper than a red gate.
# - GitSshd: ubuntu and macos runners ship the OpenSSH tools the suite needs. Windows ships no
#   sshd, so there the suite's designed named-skip behaviour fires: every fact skips with the
#   recorded reason (Q-009's fixture answers "why"), and the gate stays green - that is a recorded
#   platform fact, not a silent exclusion. The Linux sshd runs as a non-root user process, so the
#   privilege-separation directory /run/sshd must exist; the guarded mkdir below removes the one
#   runner-image variant that lacks it (Q-009's card records the non-root caveats).
# - macOS runners bill at a 10x rate; the single macOS job is accepted as the cost of proving the
#   osx-arm64 AOT artifact (I-004) and Q-007's third platform in CI. Trim the matrix only by
#   recording it here.
# - The SDK is pinned by global.json (floor 10.0.100, rollForward latestFeature) via setup-dotnet.
#
# Triggers: every push to main and every pull request targeting it; a push of a version tag (v1.0)
# runs the same gate, so the revision the PM tags is the revision CI proved green.
#
# Docs-only commits (docs/**, **/*.md, LICENSE) skip the gate: the gate proves code (build +
# suites + AOT artifacts), and no markdown in this repo is a build input - docs files are cited
# from build-file comments only - so a docs change cannot turn the gate red. One exception, and it
# is why the tooling workflow exists: scripts/tests/test_gate.py reads docs/development.md (§2) and
# docs/native-aot.md (§8) and holds every filter they print to the one the gate runs, so those two
# documents *are* inputs of a test. This workflow
# therefore runs the tooling tests on all three runners (cross-platform proof), and
# .github/workflows/tooling.yml runs them with no path filter at all (so a docs-only PR still gets
# the anti-drift check). A mixed commit (docs + code) still runs. Tag pushes are unaffected: path
# filters are not evaluated for tag pushes (GitHub's documented behaviour), so a tag always runs
# the gate. A filtered run leaves its check
# "Pending"; if the gate is ever made a required status check, docs-only PRs would be blocked, and
# the filter - not the protection rule - would be the thing to revisit.

name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
    # Docs-only commits skip the gate (reasons in the header); tag pushes ignore path filters,
    # so a version tag always runs the gate.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  workflow_dispatch:

# Superseded commits of the same PR cancel their run; pushes to main and tags always run whole.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The gate is ~15 warm minutes per OS (build + fast suite ~2.5 min + five harnesses + one AOT
    # publish); 45 is the sane ceiling, not the expectation.
    timeout-minutes: 45
    strategy:
      # A red suite on one OS must not hide the others - the first runs are the evidence that the
      # matrix decision was right.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v6

      # §1's Linux AOT prerequisite (clang + zlib development headers), installed not assumed. The
      # runner images ship both; `apt-get install` on an installed package is a fast no-op.
      - name: Ensure the NativeAOT link prerequisites exist (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      # Q-009's sshd fixture runs sshd as a non-root user process; sshd refuses to start without
      # the privilege-separation directory. GitHub's ubuntu images normally create it through the
      # openssh-server package - the guarded mkdir turns that variant into a no-op instead of a red
      # fixture failure. (macOS keeps privsep at /var/empty and always has it; Windows runs no facts.)
      - name: Ensure the sshd privilege-separation directory exists (Linux only)
        if: runner.os == 'Linux'
        run: sudo mkdir -p /run/sshd

      - name: Pin the .NET SDK from global.json
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      # The repository tooling is stdlib-only Python (scripts/zt + three front ends), so the version
      # is the only thing to pin. setup-python also puts `python` on PATH on every OS - the gate and
      # the checks below call it by that one name.
      - name: Pin Python for the repository tooling
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The tooling's own tests: pure functions (the publish matrix, the gate's filters and order,
      # the test-log reader, the prompt parsing) and front-end smoke tests. They need no SDK and no
      # network, so they run before the gate and cost seconds - a broken filter or a drifted matrix
      # is then named here instead of half way through a 15-minute gate.
      - name: Tooling tests (scripts/tests)
        run: python -m unittest discover -s scripts/tests -v

      # The §2 gate, verbatim: scripts/verify.py runs dotnet build -c Release, the fast suite with
      # its seven-clause exclusion filter (six harnesses + Load), then the six harness filters,
      # failing non-zero on the first red suite. One script, three OSes, no second transcript to drift against.
      - name: Acceptance gate (development.md §2 via scripts/verify.py)
        run: python scripts/verify.py
